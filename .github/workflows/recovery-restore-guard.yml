name: recovery-restore-guard

on:
  pull_request:
  workflow_dispatch:
    inputs:
      host:
        description: Isolated host. Production hostnames are rejected.
        required: true
        default: 127.0.0.1
        type: string
      database:
        description: Isolated database name. postgres is rejected.
        required: true
        default: tejas_isolated_20261118
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject a non-isolated restore target
        working-directory: scripts/recovery
        env:
          RESTORE_HOST: ${{ github.event.inputs.host || '127.0.0.1' }}
          RESTORE_DATABASE: ${{ github.event.inputs.database || 'tejas_isolated_20261118' }}
        run: python3 restore_target.py --host "$RESTORE_HOST" --database "$RESTORE_DATABASE"
